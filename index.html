<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPS - Módulo Logístico</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- SheetJS (Para Excel) -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <!-- HTML2Canvas (Para tomar "foto" a la pantalla) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans overflow-x-hidden">

    <!-- BARRA DE NAVEGACIÓN SUPERIOR (z-50 para estar siempre arriba) -->
    <nav class="bg-blue-900 text-white p-4 shadow-md flex justify-between items-center relative z-50">
        <div class="flex items-center gap-4">
            <!-- Botón Sanguchito con onclick directo -->
            <button onclick="toggleMenu()" class="hover:bg-blue-800 p-2 rounded transition cursor-pointer">
                <svg class="w-8 h-8 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
            <h1 class="text-2xl font-bold">IPS Logística</h1>
        </div>
        <div class="flex items-center gap-4">
            <select id="sede_selector" class="text-black rounded px-2 py-1 font-bold outline-none cursor-pointer">
                <option value="AREQUIPA">AREQUIPA</option>
                <option value="LIMA">LIMA</option>
                <option value="CUSCO">CUSCO</option>
            </select>
        </div>
    </nav>

    <!-- MENÚ LATERAL (SIDEBAR) -->
    <div id="sidebar" class="fixed inset-y-0 left-0 bg-slate-800 text-white w-72 transform -translate-x-full transition-transform duration-300 z-40 pt-20 shadow-2xl">
        <div class="flex flex-col p-4 space-y-2">
            <button onclick="cambiarVista('vista_pistoleo')" class="text-left px-4 py-3 hover:bg-blue-600 rounded font-bold transition">📦 Consola de Pistoleo</button>
            <button onclick="cambiarVista('vista_carga_almacen')" class="text-left px-4 py-3 hover:bg-blue-600 rounded font-bold transition">📥 Cargar Data (Almacén)</button>
            <button onclick="cargarReporteTecnicos()" class="text-left px-4 py-3 hover:bg-blue-600 rounded font-bold transition">📱 Reporte Técnicos (WhatsApp)</button>
            <hr class="border-slate-600 my-2">
            <button onclick="verificarAdmin()" class="text-left px-4 py-3 hover:bg-red-600 rounded font-bold text-red-300 transition flex justify-between">
                <span>⚙️ Admin Claro</span>
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </button>
        </div>
    </div>

    <!-- CONTENEDOR PRINCIPAL -->
    <div id="main_content" class="transition-all duration-300 relative z-0">

        <!-- VISTA 1: PISTOLEO -->
        <section id="vista_pistoleo" class="max-w-5xl mx-auto mt-8 grid grid-cols-1 md:grid-cols-3 gap-6 p-4 vista-seccion block">
            <div class="col-span-2 bg-white rounded-lg shadow-lg p-6 border-t-4 border-blue-600">
                <h2 class="text-xl font-bold text-gray-700 mb-4">📦 Consola de Pistoleo Rápido</h2>
                <div class="flex gap-4 mb-6">
                    <select id="tipo_flujo" class="border-2 border-gray-300 rounded p-3 font-bold text-lg w-1/2 outline-none cursor-pointer">
                        <option value="ANTIGUAMIENTO">Antiguamiento</option>
                        <option value="RECUPERADO">Recuperados</option>
                    </select>
                    <input type="text" id="caja_activa" placeholder="Caja (Ej: AQP-001)" class="border-2 border-gray-300 rounded p-3 font-bold text-lg w-1/2 uppercase outline-none">
                </div>
                <div class="bg-blue-50 border-2 border-dashed border-blue-400 rounded-lg p-8 text-center cursor-text" id="zona_pistoleo">
                    <input type="text" id="input_laser" autofocus autocomplete="off" class="w-full text-center text-4xl font-mono font-bold bg-transparent outline-none text-blue-900 placeholder-blue-200" placeholder="ESPERANDO LECTURA...">
                </div>
                <div id="resultado_cruce" class="mt-6 hidden p-4 rounded-lg border-l-4">
                    <p class="text-gray-700 font-bold" id="res_serie">Serie: ---</p>
                    <p class="text-gray-700 font-bold text-red-600 text-lg" id="res_tecnico">Técnico: ---</p>
                    <p class="text-gray-700 font-bold" id="res_sot">SOT: ---</p>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow-lg p-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-gray-700">Equipos en Caja</h2>
                    <span id="contador_caja" class="bg-blue-100 text-blue-800 text-xl font-bold px-3 py-1 rounded-full">0</span>
                </div>
                <ul id="lista_escaneados" class="space-y-2 h-64 overflow-y-auto mb-4 border-b pb-4"></ul>
                <button class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded shadow-lg cursor-pointer">🖨️ Cerrar Caja e Imprimir</button>
            </div>
        </section>

        <!-- VISTA 2: CARGA ALMACÉN -->
        <section id="vista_carga_almacen" class="max-w-4xl mx-auto mt-8 p-4 vista-seccion hidden">
            <div class="bg-white rounded-lg shadow-xl p-8 border-t-4 border-blue-500">
                <h2 class="text-2xl font-bold text-gray-800 mb-4">📥 Carga de Datos - Almacén</h2>
                <select id="origen_almacen" class="w-full border-2 p-3 mb-4 font-bold rounded outline-none cursor-pointer">
                    <option value="SPACECOM_STOCK_TECNICO">SpaceCom: Stock de Técnicos</option>
                    <option value="SPACECOM_SOTS">SpaceCom: Historial SOTs</option>
                </select>
                <input type="file" id="input_excel_almacen" accept=".xlsx, .csv" class="w-full border-2 border-dashed p-4 mb-4 cursor-pointer">
                <button id="btn_subir_almacen" class="w-full bg-blue-600 text-white font-bold py-4 rounded shadow mt-4 cursor-pointer">Subir Archivo SpaceCom</button>
                <p id="msg_almacen" class="mt-4 text-center font-bold text-blue-700"></p>
            </div>
        </section>

        <!-- VISTA 3: REPORTE TÉCNICOS -->
        <section id="vista_reporte_tecnicos" class="max-w-5xl mx-auto mt-8 p-4 vista-seccion hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-800">📱 Equipos Retenidos por Técnico</h2>
                <button onclick="cargarReporteTecnicos()" class="bg-blue-100 text-blue-800 px-4 py-2 rounded font-bold shadow hover:bg-blue-200 cursor-pointer">🔄 Actualizar</button>
            </div>
            <div id="contenedor_tecnicos" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </section>

        <!-- VISTA 4: ADMIN CLARO -->
        <section id="vista_admin" class="max-w-4xl mx-auto mt-8 p-4 vista-seccion hidden">
            <div class="bg-white rounded-lg shadow-xl p-8 border-t-4 border-red-600">
                <h2 class="text-2xl font-bold text-red-800 mb-2">⚙️ Panel Administrador: Claro</h2>
                <p class="mb-4 text-gray-600">Subir reporte de Antiguamiento (>45 días)</p>
                <input type="file" id="input_excel_admin" accept=".xlsx, .csv" class="w-full border-2 border-dashed border-red-300 bg-red-50 p-4 mb-4 cursor-pointer">
                <button id="btn_subir_admin" class="w-full bg-red-700 text-white font-bold py-4 rounded shadow mt-4 cursor-pointer">Subir Reporte de Claro</button>
                <p id="msg_admin" class="mt-4 text-center font-bold text-red-700"></p>
            </div>
        </section>

    </div>

    <script>
        // --- CONEXIÓN SUPABASE ---
        const SUPABASE_URL = 'https://fbxzhasfdvkqunnebkij.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_gRsj9jfPuuEkV7tkDFq5Nw_Rns_bcIY';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- LÓGICA DEL MENÚ A PRUEBA DE FALLOS ---
        const sidebar = document.getElementById('sidebar');

        function toggleMenu() {
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
            } else {
                sidebar.classList.add('-translate-x-full');
            }
        }

        function cambiarVista(idVista) {
            document.querySelectorAll('.vista-seccion').forEach(vista => {
                vista.classList.add('hidden');
                vista.classList.remove('block');
            });
            document.getElementById(idVista).classList.remove('hidden');
            document.getElementById(idVista).classList.add('block');
            sidebar.classList.add('-translate-x-full'); // Cierra el menú
        }

        function verificarAdmin() {
            const pass = prompt("Ingrese la contraseña (Clave: claro123):");
            if(pass === "claro123") {
                cambiarVista('vista_admin');
            } else if (pass !== null) {
                alert("Contraseña incorrecta.");
            }
            sidebar.classList.add('-translate-x-full');
        }

        // --- FOCUS LOCK CORREGIDO ---
        const inputLaser = document.getElementById('input_laser');
        document.addEventListener('click', (e) => {
            // REGLA DE ORO: Si haces clic en la barra de navegación o en el menú, ignora el Focus Lock.
            if (e.target.closest('nav') || e.target.closest('#sidebar')) {
                return;
            }
            
            // Si estás en la consola de pistoleo y no haces clic en un botón o selector, bloquea el láser
            const vistaPistoleo = document.getElementById('vista_pistoleo');
            if (!vistaPistoleo.classList.contains('hidden')) {
                if (e.target.tagName !== 'SELECT' && e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') {
                    inputLaser.focus();
                }
            } else {
                // Si haces clic fuera en otra pantalla, cierra el menú si estaba abierto
                sidebar.classList.add('-translate-x-full');
            }
        });

        // --- SONIDOS ---
        const playSound = (type) => {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            if(type === 'success') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.start(); osc.stop(ctx.currentTime + 0.15);
            } else {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.start(); osc.stop(ctx.currentTime + 0.3);
            }
        };

        // --- LÓGICA DE PISTOLEO ---
        let equiposEnCaja = 0;
        const listaEscaneados = document.getElementById('lista_escaneados');
        const contadorCaja = document.getElementById('contador_caja');

        inputLaser.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const seriePistoleada = inputLaser.value.trim().toUpperCase();
                inputLaser.value = ''; 
                if(!seriePistoleada) return;

                const { data: cruceData } = await supabase.from('cruce_spacecom').select('tecnico_asignado, sot_instalacion').eq('serie', seriePistoleada).single();
                
                const resDiv = document.getElementById('resultado_cruce');
                resDiv.classList.remove('hidden', 'bg-red-50', 'bg-green-50', 'border-red-500', 'border-green-500');
                document.getElementById('res_serie').innerText = `Serie: ${seriePistoleada}`;

                if (cruceData && cruceData.tecnico_asignado) {
                    document.getElementById('res_tecnico').innerText = `Técnico: ${cruceData.tecnico_asignado}`;
                    document.getElementById('res_sot').innerText = `SOT: ${cruceData.sot_instalacion || 'Stock'}`;
                    resDiv.classList.add('bg-red-50', 'border-red-500'); 
                } else {
                    document.getElementById('res_tecnico').innerText = `Stock Almacén`;
                    document.getElementById('res_sot').innerText = ``;
                    resDiv.classList.add('bg-green-50', 'border-green-500');
                }

                const sedeSeleccionada = document.getElementById('sede_selector').value;
                const { error: insertError } = await supabase.from('equipos_escaneados').insert([{ serie: seriePistoleada, sede: sedeSeleccionada }]);

                if (insertError) {
                    playSound('error'); 
                    alert(`ERROR: ${insertError.message}`);
                } else {
                    playSound('success'); 
                    equiposEnCaja++;
                    contadorCaja.innerText = equiposEnCaja;
                    const li = document.createElement('li');
                    li.className = 'text-sm font-mono bg-gray-50 p-2 rounded border flex justify-between';
                    li.innerHTML = `<span class="text-green-600 font-bold">✓ ${seriePistoleada}</span>`;
                    lista_escaneados.prepend(li); 
                }
            }
        });

        // --- SUBIDA DE EXCEL ---
        async function procesarExcel(inputId, origenVal, btnId, msgId) {
            const fileInput = document.getElementById(inputId);
            const msgLabel = document.getElementById(msgId);
            const file = fileInput.files[0];
            if (!file) { alert("Selecciona un archivo primero"); return; }
            
            msgLabel.innerText = "Leyendo archivo... espere.";
            const reader = new FileReader();
            reader.onload = async (event) => {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { defval: "" });
                
                const datosMapeados = jsonData.map(fila => ({
                    serie: (fila['SERIE'] || fila['S/N'] || fila['Serie'] || fila['IMEI'] || '').toString().trim().toUpperCase(),
                    sku: (fila['SKU'] || fila['CODIGO'] || '').toString().trim(),
                    modelo: (fila['MODELO'] || fila['DESCRIPCION'] || '').toString().trim(),
                    tecnico_asignado: (fila['TECNICO'] || fila['NOMBRE TECNICO'] || fila['Técnico'] || '').toString().trim(),
                    sot_instalacion: (fila['SOT'] || fila['ORDEN'] || '').toString().trim(),
                    dias_antiguedad: parseInt(fila['DIAS'] || fila['ANTIGUEDAD'] || fila['Dias'] || 0),
                    origen_reporte: origenVal
                })).filter(f => f.serie !== '');

                msgLabel.innerText = `Subiendo ${datosMapeados.length} registros...`;
                const TAMAÑO_LOTE = 1000;
                for (let i = 0; i < Math.ceil(datosMapeados.length / TAMAÑO_LOTE); i++) {
                    const lote = datosMapeados.slice(i * TAMAÑO_LOTE, (i + 1) * TAMAÑO_LOTE);
                    await supabase.from('cruce_spacecom').upsert(lote, { onConflict: 'serie' });
                }
                msgLabel.innerText = "✅ Datos subidos correctamente.";
                fileInput.value = "";
            };
            reader.readAsArrayBuffer(file);
        }

        document.getElementById('btn_subir_almacen').addEventListener('click', () => {
            procesarExcel('input_excel_almacen', document.getElementById('origen_almacen').value, 'btn_subir_almacen', 'msg_almacen');
        });

        document.getElementById('btn_subir_admin').addEventListener('click', () => {
            procesarExcel('input_excel_admin', 'CLARO_ANTIGUAMIENTO', 'btn_subir_admin', 'msg_admin');
        });

        // --- REPORTE WHATSAPP ---
        async function cargarReporteTecnicos() {
            cambiarVista('vista_reporte_tecnicos');
            const contenedor = document.getElementById('contenedor_tecnicos');
            contenedor.innerHTML = '<p class="text-blue-500 font-bold col-span-2 text-center">Consultando base de datos...</p>';

            const { data, error } = await supabase.from('cruce_spacecom').select('*').not('tecnico_asignado', 'is', null).neq('tecnico_asignado', '');
            if(error || !data) { contenedor.innerHTML = `<p class="text-red-500">Error</p>`; return; }

            const agrupado = {};
            data.forEach(item => {
                if(!agrupado[item.tecnico_asignado]) agrupado[item.tecnico_asignado] = [];
                agrupado[item.tecnico_asignado].push(item);
            });

            contenedor.innerHTML = '';
            if(Object.keys(agrupado).length === 0) { contenedor.innerHTML = '<p class="text-gray-500">Sin equipos retenidos.</p>'; return; }

            for (const [tecnico, equipos] of Object.entries(agrupado)) {
                const cardId = 'card_' + tecnico.replace(/[^a-zA-Z0-9]/g, '');
                let htmlEquipos = equipos.map(eq => `<div class="flex justify-between border-b py-1"><span class="font-mono text-sm font-bold text-gray-800">${eq.serie}</span><span class="text-xs text-gray-500">${eq.modelo || '-'}</span></div>`).join('');
                
                contenedor.innerHTML += `
                    <div class="bg-white rounded-lg shadow-md border overflow-hidden flex flex-col">
                        <div id="${cardId}" class="p-4 bg-white">
                            <div class="bg-blue-900 text-white p-3 rounded text-center mb-3">
                                <h3 class="font-bold uppercase">${tecnico}</h3>
                                <p class="text-xs text-blue-200">Equipos Pendientes: ${equipos.length}</p>
                            </div>
                            <div class="space-y-1 mb-2 max-h-40 overflow-y-auto">${htmlEquipos}</div>
                            <p class="text-center text-xs text-gray-400 mt-2 border-t pt-2">Devolver a almacén</p>
                        </div>
                        <div class="bg-gray-50 p-3 border-t">
                            <button onclick="copiarComoImagen('${cardId}')" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-2 rounded shadow cursor-pointer">
                                📸 Copiar para WhatsApp
                            </button>
                        </div>
                    </div>`;
            }
        }

        async function copiarComoImagen(elementId) {
            try {
                const canvas = await html2canvas(document.getElementById(elementId), { scale: 2 }); 
                canvas.toBlob(async (blob) => {
                    await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
                    alert("¡Imagen copiada! Ve a WhatsApp y presiona Pegar (Ctrl+V)");
                });
            } catch (err) { alert("Error al copiar imagen. Intenta de nuevo."); }
        }
    </script>
</body>
</html>
